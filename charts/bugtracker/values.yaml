# Default values for the bugtracker chart (secure by default).

nameOverride: ""
fullnameOverride: ""

image:
  repository: krys3x15/bugtracker
  # REQUIRED: full commit SHA built by CI. "latest" is rejected by the chart.
  # Set per environment (GitOps repo: environments/<env>/values.yaml).
  tag: ""
  pullPolicy: Always

replicaCount: 2

# Kubernetes Secret created outside the chart (kubectl now, SealedSecret from stage 12).
# Required keys: db-password, secret-key
existingSecret: bugtracker-secrets

app:
  containerPort: 8000
  enableDocs: false
  # true only when served over HTTPS
  cookieSecure: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  # Group ownership of mounted secret files (mode 0440).
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: localhost
  annotations: {}

database:
  # In-cluster PostgreSQL. Set enabled=false and host=... to use an external DB.
  enabled: true
  host: ""
  port: 5432
  name: bugtracker
  user: bugtracker
  image:
    repository: postgres
    # Pinned release + digest (never "latest").
    tag: 16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  # VULN-07: NetworkPolicy disabled - every pod in the cluster can reach the
  # database and the app directly, and the app can connect anywhere (no egress control)
  enabled: false
  # Where the ingress controller runs (k3d: Traefik in kube-system).
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

# Namespace-wide cap (ResourceQuota). Requests now: app 2x(50m/96Mi) + surge
# pod + db 100m/128Mi = 250m/416Mi; limits 2000m/1280Mi.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    requests.storage: 5Gi
    persistentvolumeclaims: "3"
    pods: "10"
    services: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"

# Per-container / per-PVC defaults and bounds (LimitRange).
limitRange:
  enabled: true
  container:
    default:
      cpu: 250m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    min:
      cpu: 10m
      memory: 32Mi
    max:
      cpu: "1"
      memory: 1Gi
  pvc:
    min:
      storage: 100Mi
    max:
      storage: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
