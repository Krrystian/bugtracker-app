apiVersion: v1
kind: Service
metadata:
  name: {{ include "bugtracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bugtracker.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
