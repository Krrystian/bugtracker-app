{{- if .Values.database.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bugtracker.dbName" . }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    {{- include "bugtracker.selectorLabels" (dict "ctx" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
{{- end }}
