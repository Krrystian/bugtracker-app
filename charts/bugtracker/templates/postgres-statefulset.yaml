{{- if .Values.database.enabled -}}
# PostgreSQL as a StatefulSet: stable pod name (<name>-0), stable network
# identity through the headless Service and its own PVC from volumeClaimTemplates.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bugtracker.dbName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    checkov.io/skip1: CKV_K8S_40=UID 70 is the postgres user of the official image; non-root is enforced (runAsNonRoot, PSA restricted); changing it breaks ownership of existing data
spec:
  serviceName: {{ include "bugtracker.dbName" . }}-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Keep the database volume when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "bugtracker.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bugtracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bugtracker.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bugtracker.fullname" . }}-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bugtracker.fullname" . }}-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/bugtracker/db_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}, "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/bugtracker
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: db-password
                path: db_password
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "bugtracker.selectorLabels" (dict "ctx" . "component" "database") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
{{- end }}
