{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bugtracker.serviceAccountName" . }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
