{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bugtracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
  annotations:
    # VULN-08: route all traffic through the misconfigured proxy middleware
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-proxy-headers@kubernetescrd" .Release.Namespace (include "bugtracker.fullname" .) | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bugtracker.fullname" . }}
                port:
                  name: http
{{- end }}
