apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugtracker
  namespace: bugtracker
  labels:
    app.kubernetes.io/name: bugtracker
    app.kubernetes.io/part-of: bugtracker
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugtracker
                port:
                  name: http
