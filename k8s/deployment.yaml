# Secret "bugtracker-secrets" (keys: db-password, secret-key) is created manually
# with `kubectl create secret` and is NOT stored in this repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bugtracker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: bugtracker
  annotations:
    checkov.io/skip1: CKV_K8S_40=UID 70 is the postgres user of the official image; non-root is enforced (runAsNonRoot, PSA restricted); changing it breaks ownership of existing data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: bugtracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bugtracker
            - name: POSTGRES_USER
              value: bugtracker
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/bugtracker/db_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bugtracker", "-d", "bugtracker", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bugtracker", "-d", "bugtracker", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/bugtracker
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: secrets
          secret:
            secretName: bugtracker-secrets
            defaultMode: 0440
            items:
              - key: db-password
                path: db_password
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugtracker
  namespace: bugtracker
  labels:
    app.kubernetes.io/name: bugtracker
    app.kubernetes.io/part-of: bugtracker
  annotations:
    # Stage 3 manifests for Docker Desktop use a locally built image that is
    # loaded into the node, so it can be neither pulled nor pinned by digest.
    checkov.io/skip1: CKV_K8S_15=Local image for Docker Desktop (loaded into the node); pulling is impossible by design
    checkov.io/skip2: CKV_K8S_43=Local image for Docker Desktop has no registry digest; the Helm chart deploys signed registry images
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bugtracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bugtracker
        app.kubernetes.io/part-of: bugtracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bugtracker
          # Local image for Docker Desktop tests (stage 3). From stage 4 on the
          # image comes from Docker Hub tagged with the commit SHA.
          image: bugtracker:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: bugtracker
            - name: DB_USER
              value: bugtracker
            # Secrets are mounted as files (not env vars), see volumes below.
            - name: SECRETS_DIR
              value: /run/secrets/bugtracker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # The app waits up to ~60 s for the database before listening;
          # liveness checks start only after the startup probe succeeds.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/bugtracker
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: bugtracker-secrets
            defaultMode: 0440
            items:
              - key: db-password
                path: db_password
              - key: secret-key
                path: secret_key
