# TEMPORARY (stage 7): stand-in for Argo CD behind the tunnel, removed in stage 8
# when the same Ingress rule points at argocd-server.
apiVersion: v1
kind: Namespace
metadata:
  name: webhook-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: webhook-test
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: webhook-test
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The only route reachable through the tunnel: Host argo-webhook.tunnel + exact /api/webhook.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-webhook
  namespace: webhook-test
spec:
  ingressClassName: traefik
  rules:
    - host: argo-webhook.tunnel
      http:
        paths:
          - path: /api/webhook
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami
  namespace: webhook-test
spec:
  podSelector:
    matchLabels:
      app: whoami
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  egress: []
