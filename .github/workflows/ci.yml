name: CI

on:
  # Feature branches are checked via their pull request. vuln/* branches are
  # never merged (no PR), so they run on push.
  push:
    branches: [main, "vuln/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bugtracker
  # amd64 for CI runners, arm64 for local k3d on Apple Silicon.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # --- Security scanners: independent jobs (no "needs" between them), so one
  # failing scanner never hides the reports of the others. ---------------------

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/owasp-top-ten --config p/jwt \
              --config .semgrep/rules.yml \
              --metrics=off --sarif-output=semgrep.sarif --text
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Security gate (High/Critical)
        run: python3 scripts/sarif-gate.py semgrep.sarif

  build:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishing only from main and only after tests, build and ALL security
  # scanners are green.
  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-24.04
    needs: [test, build, sast-semgrep]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  # Tell the GitOps repo about the new image. It commits the tag to its
  # "development" branch; deployment still needs a manual PR to its "main".
  dispatch:
    name: Notify GitOps repo
    runs-on: ubuntu-24.04
    needs: [test, build, sast-semgrep, publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: repository_dispatch -> Krrystian/bugtracker-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/Krrystian/bugtracker-gitops/dispatches \
            -f event_type=image-published \
            -f "client_payload[tag]=${GITHUB_SHA}" \
            -f "client_payload[source_repository]=${GITHUB_REPOSITORY}"
          echo "Wysłano image-published dla ${GITHUB_SHA} do repozytorium GitOps" >> "$GITHUB_STEP_SUMMARY"
