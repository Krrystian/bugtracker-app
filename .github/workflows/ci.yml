name: CI

on:
  # Feature branches are checked via their pull request. vuln/* branches are
  # never merged (no PR), so they run on push.
  push:
    branches: [main, "vuln/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bugtracker
  # amd64 for CI runners, arm64 for local k3d on Apple Silicon.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # --- Security scanners: independent jobs (no "needs" between them), so one
  # failing scanner never hides the reports of the others. ---------------------

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/owasp-top-ten --config p/jwt \
              --config .semgrep/rules.yml \
              --metrics=off --sarif-output=semgrep.sarif --text
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Security gate (High/Critical)
        run: python3 scripts/sarif-gate.py semgrep.sarif

  sca-osv:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      OSV_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner (lock files)
        # requirements*.txt are full lock files (scripts/lock-deps.sh), so
        # --no-resolve scans exactly the versions that ship instead of guessing
        # transitive versions. Exit code 1 = vulnerabilities found (handled by
        # the gate below after the SARIF upload); anything higher is a tool error.
        # The workspace is mounted under the same path so SARIF locations map to repo files.
        run: |
          set +e
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$OSV_IMAGE" scan source \
            --recursive --no-resolve --format sarif --output-file "$PWD/osv.sarif" "$PWD"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed (exit $rc)"; exit "$rc"; fi
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: Security gate (High/Critical)
        run: python3 scripts/sarif-gate.py osv.sarif

  iac-checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.26@sha256:8e63f217cb084f1c1a067326a9cf6e37d54bdc82e5822210d50ca4e2f647dd93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov (Helm chart + Kubernetes manifests)
        # The Helm framework renders charts/bugtracker (namespace via HELM_NAMESPACE,
        # image.tag = this commit) and maps findings to template files; the
        # kubernetes framework covers k8s/ and infra/. --soft-fail only defers the
        # decision to the gate step below. Justified per-resource exceptions are
        # checkov.io/skip annotations.
        # Checkov only WARNS when a chart cannot be rendered and then passes
        # without checking it, so that case is turned into a hard failure.
        run: |
          mkdir -p checkov
          printf 'image:\n  tag: "%s"\n' "$GITHUB_SHA" > checkov/values.yaml
          docker run --rm -e HELM_NAMESPACE=bugtracker -v "$PWD:$PWD" -w "$PWD" "$CHECKOV_IMAGE" \
            -d "$PWD" --framework helm kubernetes --var-file "$PWD/checkov/values.yaml" \
            --compact --soft-fail -o cli -o sarif --output-file-path "console,$PWD/checkov/results.sarif" \
            2>&1 | tee checkov/output.txt
          if grep -q "Failed processing helm chart" checkov/output.txt; then
            echo "::error::Checkov could not render the Helm chart (see output above)"; exit 1
          fi
          grep -q "^helm scan results:" checkov/output.txt \
            || { echo "::error::no Helm scan results - chart was not checked"; exit 1; }
      - name: Map Helm findings to chart template paths
        # Checkov reports rendered charts under its temp dir (tmp/tmpXXXX/...) or
        # relative to charts/; rewrite them to repo paths so alerts link to files.
        # Written to a new file: results.sarif is owned by root (Checkov container).
        run: |
          python3 - <<'PY'
          import json, re
          sarif = json.load(open("checkov/results.sarif"))
          for run in sarif["runs"]:
              for result in run["results"]:
                  for loc in result.get("locations", []):
                      art = loc["physicalLocation"]["artifactLocation"]
                      m = re.search(r"(?:^|/)(?:charts/)?(bugtracker/templates/.+)$", art["uri"])
                      if m:
                          art["uri"] = "charts/" + m.group(1)
          json.dump(sarif, open("checkov/results-mapped.sarif", "w"))
          PY
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: checkov/results-mapped.sarif
          category: checkov
      - name: Security gate (High/Critical)
        run: python3 scripts/sarif-gate.py checkov/results-mapped.sarif

  build:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (all platforms)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The amd64 image is handed to the jobs that analyse the built image
      # (SBOM now; image scan and DAST later) as a run artifact.
      - name: Build amd64 image for analysis
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
      - name: Export image
        run: docker save "${IMAGE_NAME}:ci" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: image.tar
          retention-days: 1

  # Software Bill of Materials of the built image (inventory, not a gate).
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
      - name: Generate CycloneDX SBOM (Syft)
        # Packages only (OS + Python); per-file entries are left out.
        run: |
          docker run --rm -e SYFT_FILE_METADATA_SELECTION=none -v "$PWD:/w" "$SYFT_IMAGE" \
            scan docker-archive:/w/image.tar \
            --source-name "docker.io/krys3x15/${IMAGE_NAME}" --source-version "$GITHUB_SHA" \
            -o cyclonedx-json=/w/sbom.cdx.json
      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json
          bom = json.load(open("sbom.cdx.json"))
          comps = bom.get("components", [])
          eco = collections.Counter(
              c["purl"].split(":")[1].split("/")[0] if c.get("purl") else "other" for c in comps)
          print(f"### SBOM: {bom['bomFormat']} {bom['specVersion']}, {len(comps)} components")
          print("| ecosystem | components |\n|---|---|")
          for name, count in eco.most_common():
              print(f"| {name} | {count} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  # Dynamic scan of the running app: ephemeral k3d cluster + local registry,
  # the Helm chart deployed with the image from this run, OWASP ZAP baseline.
  # Needs Checkov: the chart is only deployed after it passed the IaC scan.
  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-24.04
    needs: [build, iac-checkov]
    permissions:
      contents: read
      security-events: write
    env:
      ZAP_IMAGE: zaproxy/zap-stable:20261008@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
      - name: Load image
        run: docker load -i image.tar
      - name: Install k3d and Helm (pinned, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  $RUNNER_TEMP/bin/k3d" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/k3d"
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Deploy to ephemeral k3d and run ZAP baseline
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:ci
          TAG: ${{ github.sha }}
          OUT: zap
        run: scripts/dast-zap.sh
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('zap/zap.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: zap/zap.sarif
          category: zap
      - name: Upload ZAP HTML report
        if: always() && hashFiles('zap/zap.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            zap/zap.html
            zap/zap.json
          retention-days: 30
      - name: Security gate (High/Critical)
        run: python3 scripts/sarif-gate.py zap/zap.sarif

  # Publishing only from main and only after tests, build and ALL security
  # scanners are green. The SBOM must exist too (signed with the image, stage 14).
  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-24.04
    needs: [test, build, sbom, sast-semgrep, sca-osv, iac-checkov, dast-zap]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  # Tell the GitOps repo about the new image. It commits the tag to its
  # "development" branch; deployment still needs a manual PR to its "main".
  dispatch:
    name: Notify GitOps repo
    runs-on: ubuntu-24.04
    needs: [test, build, sbom, sast-semgrep, sca-osv, iac-checkov, dast-zap, publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: repository_dispatch -> Krrystian/bugtracker-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/Krrystian/bugtracker-gitops/dispatches \
            -f event_type=image-published \
            -f "client_payload[tag]=${GITHUB_SHA}" \
            -f "client_payload[source_repository]=${GITHUB_REPOSITORY}"
          echo "Wysłano image-published dla ${GITHUB_SHA} do repozytorium GitOps" >> "$GITHUB_STEP_SUMMARY"
